name: SonarCloud

on:
  push:
    branches: [main, master, develop]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  find-maven-projects:
    name: Find Maven projects
    runs-on: ubuntu-latest

    outputs:
      projects: ${{ steps.projects.outputs.projects }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Maven project matrix
        id: projects
        shell: bash
        run: |
          set -euo pipefail

          projects="$(
            find . -name pom.xml \
              -not -path '*/target/*' \
              -not -path './.git/*' \
              | sed 's#^\./##' \
              | xargs -n1 dirname \
              | sort -u \
              | jq -R -s -c 'split("\n") | map(select(length > 0))'
          )"

          echo "projects=$projects" >> "$GITHUB_OUTPUT"
          echo "$projects"

  sonarcloud:
    name: SonarCloud - ${{ matrix.project }}
    runs-on: ubuntu-latest
    needs: find-maven-projects

    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        project: ${{ fromJSON(needs.find-maven-projects.outputs.projects) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make Maven wrappers executable
        shell: bash
        run: |
          find . -name mvnw -type f -exec chmod +x {} \;

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build Maven project
        shell: bash
        working-directory: ${{ matrix.project }}
        run: |
          set -euo pipefail
          mvn -B -DskipTests clean compile

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: ${{ matrix.project }}
          args: >
            -Dsonar.organization=YOUR_SONARCLOUD_ORGANIZATION_KEY
            -Dsonar.projectKey=YOUR_SONARCLOUD_PROJECT_KEY_${{ matrix.project }}
            -Dsonar.projectName=${{ matrix.project }}
            -Dsonar.sources=src
            -Dsonar.java.binaries=target/classes
            -Dsonar.exclusions=**/target/**,**/.mvn/**,**/mvnw,**/mvnw.cmd
