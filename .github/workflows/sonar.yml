name: SonarCloud

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    name: Compile all Maven projects and analyze with SonarCloud
    runs-on: ubuntu-latest

    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make Maven wrappers executable
        shell: bash
        run: |
          find . -name mvnw -type f -exec chmod +x {} \;

      - name: Set up JDK 8 for old Spring Boot projects
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Compile all Maven projects
        shell: bash
        run: |
          set -uo pipefail

          failed=0

          while IFS= read -r pom; do
            dir="$(dirname "$pom")"
            echo "Compiling Maven project: $dir"

            if ! mvn -B -f "$pom" -DskipTests clean compile; then
              echo "::error::Maven compile failed for $dir"
              failed=1
            fi
          done < <(
            find . -name pom.xml \
              -not -path '*/target/*' \
              -not -path './.git/*' \
              -not -path './pom.xml' \
              | sort
          )

          exit "$failed"

      - name: Generate SonarCloud aggregator POM
        shell: bash
        run: |
          set -euo pipefail

          cat > sonar-aggregate-pom.xml <<'EOF'
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>generated.sonar</groupId>
            <artifactId>sonar-aggregate</artifactId>
            <version>1.0.0</version>
            <packaging>pom</packaging>
            <modules>
          EOF

          find . -name pom.xml \
            -not -path '*/target/*' \
            -not -path './.git/*' \
            -not -path './pom.xml' \
            | sed 's#^\./##' \
            | xargs -n1 dirname \
            | sort -u \
            | while IFS= read -r module; do
                echo "              <module>$module</module>" >> sonar-aggregate-pom.xml
              done

          cat >> sonar-aggregate-pom.xml <<'EOF'
            </modules>
          </project>
          EOF

          cat sonar-aggregate-pom.xml

      - name: Set up JDK 17 for SonarCloud scanner
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Analyze with SonarCloud using Maven
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION_KEY: ${{ secrets.SONAR_ORGANIZATION_KEY }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          set -euo pipefail

          mvn -B -f sonar-aggregate-pom.xml org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization="research-projects-all" \
            -Dsonar.projectKey="research-projects-all_spring-boot-tutorial" \
            -Dsonar.projectName="spring-boot-tutorial" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.exclusions="**/target/**,**/.mvn/**,**/mvnw,**/mvnw.cmd,**/node_modules/**,**/dist/**,**/build/**"
