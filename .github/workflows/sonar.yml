name: SonarCloud

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    name: Compile Maven projects and analyze with SonarCloud
    runs-on: ubuntu-latest

    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make Maven wrappers executable
        shell: bash
        run: |
          find . -name mvnw -type f -exec chmod +x {} \;

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile Maven projects
        shell: bash
        run: |
          set -uo pipefail

          mkdir -p .ci

          : > .ci/compiled-projects.txt
          : > .ci/failed-projects.txt

          while IFS= read -r pom; do
            dir="$(dirname "$pom")"
            echo "Compiling Maven project: $dir"

            if mvn -B -f "$pom" -DskipTests clean compile; then
              echo "$dir" >> .ci/compiled-projects.txt
            else
              echo "::warning::Maven compile failed for $dir"
              echo "$dir" >> .ci/failed-projects.txt
            fi
          done < <(
            find . -name pom.xml \
              -not -path '*/target/*' \
              -not -path './.git/*' \
              -not -path './pom.xml' \
              | sort
          )

          echo "Compiled projects:"
          cat .ci/compiled-projects.txt || true

          echo "Failed projects:"
          cat .ci/failed-projects.txt || true

          if [ ! -s .ci/compiled-projects.txt ]; then
            echo "No Maven projects compiled successfully."
            exit 1
          fi

      - name: Prepare SonarCloud paths
        id: sonar-paths
        shell: bash
        run: |
          set -euo pipefail

          src_dirs="$(
            while IFS= read -r dir; do
              if [ -d "$dir/src/main/java" ]; then
                echo "${dir#./}/src/main/java"
              fi
            done < .ci/compiled-projects.txt | sort -u | paste -sd, -
          )"

          binary_dirs="$(
            while IFS= read -r dir; do
              if [ -d "$dir/target/classes" ]; then
                echo "${dir#./}/target/classes"
              fi
            done < .ci/compiled-projects.txt | sort -u | paste -sd, -
          )"

          if [ -z "$src_dirs" ]; then
            echo "No Java source directories found in compiled projects."
            exit 1
          fi

          if [ -z "$binary_dirs" ]; then
            echo "No Java binary directories found in compiled projects."
            exit 1
          fi

          echo "sources=$src_dirs" >> "$GITHUB_OUTPUT"
          echo "binaries=$binary_dirs" >> "$GITHUB_OUTPUT"

      - name: Create temporary Maven POM for SonarCloud
        shell: bash
        run: |
          cat > sonar-pom.xml <<'EOF'
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>generated.sonar</groupId>
            <artifactId>spring-boot-tutorial-sonar</artifactId>
            <version>1.0.0</version>
            <packaging>pom</packaging>
          </project>
          EOF

      - name: Analyze with SonarCloud using Maven scanner
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION_KEY: ${{ secrets.SONAR_ORGANIZATION_KEY }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          set -euo pipefail
          
          mvn -B -f sonar-pom.xml org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization="research-projects-all" \
            -Dsonar.projectKey="research-projects-all_spring-boot-tutorial" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.sources="${{ steps.sonar-paths.outputs.sources }}" \
            -Dsonar.java.binaries="${{ steps.sonar-paths.outputs.binaries }}" \
            -Dsonar.exclusions="**/target/**,**/.mvn/**,**/mvnw,**/mvnw.cmd,**/node_modules/**,**/dist/**,**/build/**"
