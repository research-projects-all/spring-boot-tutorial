name: CodeQL

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    - cron: '36 22 * * 1'

permissions:
  security-events: write
  packages: read
  actions: read
  contents: read

jobs:
  codeql:
    name: Compile all Maven projects and analyze with CodeQL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make Maven wrappers executable
        shell: bash
        run: |
          find . -name mvnw -type f -exec chmod +x {} \;

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Compile all Maven projects for CodeQL
        shell: bash
        run: |
          set -euo pipefail

          find . -name pom.xml \
            -not -path '*/target/*' \
            -not -path './.git/*' \
            -not -path './pom.xml' \
            | sort \
            | while read -r pom; do
                dir="$(dirname "$pom")"
                echo "Compiling Maven project for CodeQL: $dir"
                mvn -B -f "$pom" -DskipTests clean compile
              done

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
