name: CodeQL

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    - cron: '36 22 * * 1'

permissions:
  security-events: write
  packages: read
  actions: read
  contents: read

jobs:
  codeql:
    name: Compile Maven projects and analyze with CodeQL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make Maven wrappers executable
        shell: bash
        run: |
          find . -name mvnw -type f -exec chmod +x {} \;

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Compile Maven projects for CodeQL
        shell: bash
        run: |
          set -uo pipefail

          mkdir -p .ci

          : > .ci/compiled-projects.txt
          : > .ci/failed-projects.txt

          while IFS= read -r pom; do
            dir="$(dirname "$pom")"
            echo "Compiling Maven project for CodeQL: $dir"

            if mvn -B -f "$pom" -DskipTests clean compile; then
              echo "$dir" >> .ci/compiled-projects.txt
            else
              echo "::warning::Maven compile failed for $dir"
              echo "$dir" >> .ci/failed-projects.txt
            fi
          done < <(
            find . -name pom.xml \
              -not -path '*/target/*' \
              -not -path './.git/*' \
              -not -path './pom.xml' \
              | sort
          )

          echo "Compiled projects:"
          cat .ci/compiled-projects.txt || true

          echo "Failed projects:"
          cat .ci/failed-projects.txt || true

          if [ ! -s .ci/compiled-projects.txt ]; then
            echo "No Maven projects compiled successfully."
            exit 1
          fi

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
