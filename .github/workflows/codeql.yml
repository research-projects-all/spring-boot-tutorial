name: "CodeQL Advanced"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '36 22 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }} - ${{ matrix.project }})
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: none
            project: spring-boot-crud-rest

          - language: java-kotlin
            build-mode: none
            project: springboot-thymeleaf-security-demo

          - language: javascript-typescript
            build-mode: none
            project: registration-login-springboot-security-thymeleaf

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make Maven wrappers executable
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: |
          find . -name mvnw -type f -exec chmod +x {} \;

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config: |
            paths:
              - ${{ matrix.project }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}/${{ matrix.project }}"
